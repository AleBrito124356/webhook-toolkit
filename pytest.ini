[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
# A leaked sqlite3 connection (or socket, or file) must fail the suite, not just
# print a warning. The ResourceWarning is raised from a finalizer, so pytest
# reports it as an "unraisable exception" warning; escalate both.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
    # Starlette 1.x nudges TestClient users towards a different HTTP client;
    # the tests keep using the httpx it still supports.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
